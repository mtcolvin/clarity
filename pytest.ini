[pytest]
# The modules are flat at the repo root (import db, import api, ...). `python -m pytest`
# puts the current directory on sys.path by itself; the bare `pytest` entry point does
# not, so without this it fails in conftest with "No module named 'db'" — which is what
# CI runs, and what the README tells a new user to run.
pythonpath = .
testpaths = tests

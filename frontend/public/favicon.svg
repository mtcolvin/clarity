<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Clarity: the app's chart in miniature, in its dark-theme colours (index.css):
       page ground, the green reference band, a guideline, the slate trend and one
       out-of-range red point. Drawn heavy on purpose so it still reads at 16px in a tab. -->
  <rect width="64" height="64" rx="14" fill="#11161b"/>
  <rect x="0" y="38" width="64" height="14" fill="#69db7c" fill-opacity="0.3"/>
  <line x1="0" y1="22" x2="64" y2="22" stroke="#9db2c4" stroke-opacity="0.5" stroke-width="2"/>
  <polyline points="6,45 14,43 20,37 25,15 32,31 40,40 49,43 58,41" fill="none" stroke="#9db2c4"
            stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="15" r="4.5" fill="#fa5252" stroke="#11161b" stroke-width="2"/>
</svg>
